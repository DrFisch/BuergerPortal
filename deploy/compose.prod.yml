# Betrieb des BürgerPortals mit BundID-Simulator und Postkorb-Simulation auf einer VM (alles in Containern, E-004).
#
#   docker compose -f compose.prod.yml --env-file .env up -d
#
# Werte (Domain, Passwörter, Schlüssel) stehen in .env neben dieser Datei – Vorlage: .env.example. Die .env und der
# Ordner secrets/ (OpenIddict- und Data-Protection-Zertifikat) gehören NICHT ins Repository.
#
# Nur Caddy hat Ports nach außen (80, 443, 443/udp). Alle anderen Dienste sind nur im internen Netz erreichbar;
# Caddy trägt die öffentlichen Hostnamen zusätzlich als Netzwerk-Alias, damit z. B. Web und API den Auth-Server intern
# unter derselben https-Adresse erreichen wie der Browser (Issuer der Tokens).
name: bpsim

# Container-Logs begrenzen (Docker schreibt sonst unbegrenzt): je Dienst höchstens 3 Dateien à 10 MB
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-dotnet: &dotnet
  restart: unless-stopped
  logging: *logging
  environment: &dotnet-env
    ASPNETCORE_ENVIRONMENT: Production
    TZ: Europe/Berlin
    # SQL-Befehle nur bei Warnungen/Fehlern loggen – Hintergrunddienste der API fragen regelmäßig ab
    Logging__LogLevel__Microsoft.EntityFrameworkCore.Database.Command: Warning
  depends_on:
    sqlserver:
      condition: service_healthy

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    logging: *logging
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      BPSIM_DOMAIN: ${BPSIM_DOMAIN:?BPSIM_DOMAIN fehlt}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL fehlt (Kontakt für Let's Encrypt)}
      # Ziel von bundid.<domain>/postfach je nach Postfach-Variante (BPSIM_POSTFACH, siehe .env.example)
      BPSIM_POSTFACH_UPSTREAM: postfach-${BPSIM_POSTFACH:-simulator}:8080
      # Content-Security-Policy durchsetzen (Standard) oder nur melden (…-Report-Only), siehe .env.example
      BPSIM_CSP_HEADER: ${BPSIM_CSP_HEADER:-Content-Security-Policy}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      default:
        aliases:
          - ${BPSIM_DOMAIN}
          - auth.${BPSIM_DOMAIN}
          - bundid.${BPSIM_DOMAIN}
          - postkorb.${BPSIM_DOMAIN}
    mem_limit: 128m

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    logging: *logging
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?SQL_SA_PASSWORD fehlt}
      # Obergrenze für den Puffer-Cache von SQL Server (sonst nimmt er sich fast den gesamten Container-Speicher).
      MSSQL_MEMORY_LIMIT_MB: ${SQL_MEMORY_LIMIT_MB:-1024}
      TZ: Europe/Berlin
    volumes:
      - sqldata:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q \"SELECT 1\" -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    mem_limit: ${SQL_MEM_LIMIT:-2g}

  bundid-simulator:
    # Fork des BundID-Simulators der Bundesagentur für Arbeit (Branch bpsim/standardkonform): signierte Assertions,
    # IdP-Metadaten, eIDAS-LoA-URIs, Postkorb-Handle, Anmeldesitzung (Single Sign-on).
    image: ${BUNDID_SIM_IMAGE:-bpsim-bundid-simulator:latest}
    restart: unless-stopped
    logging: *logging
    environment:
      APP_SAML_IDPENTITYID: https://bundid.${BPSIM_DOMAIN}/saml/metadata
      APP_SAML_SSOURL: https://bundid.${BPSIM_DOMAIN}/saml
      APP_SAML_LOAFORMAT: eidas
      APP_SAML_POSTKORBHANDLE_ENABLED: "true"
      APP_SAML_SIGNING_ENABLED: "true"
      APP_SAML_SIGNING_KEYSTORE: /app/data/idp-signing.p12
      APP_SAML_SIGNING_PASSWORD: ${BUNDID_SIM_KEYSTORE_PASSWORD:?BUNDID_SIM_KEYSTORE_PASSWORD fehlt}
      # Anmeldesitzung wie bei der echten BundID: Das Postfach meldet sich ohne erneute Personenauswahl an.
      APP_SSO_ENABLED: "true"
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      # Hinter Caddy: X-Forwarded-Proto auswerten, damit Weiterleitungen (z. B. im Postfach) https:// enthalten
      SERVER_FORWARDHEADERSSTRATEGY: native
      # Postfach im simulierten BundID-Konto (Variante „simulator“): /postfach und Einlieferung POST /api/v1/messages
      # (nur intern). Läuft immer mit; welches Postfach genutzt wird, entscheidet BPSIM_POSTFACH.
      APP_POSTFACH_ENABLED: "true"
      APP_POSTFACH_APIKEY: ${POSTKORB_API_KEY:?POSTKORB_API_KEY fehlt}
      APP_POSTFACH_PORTALURL: https://${BPSIM_DOMAIN}/
      APP_POSTFACH_PORTALNAME: BürgerPortal
      JAVA_TOOL_OPTIONS: -XX:MaxRAMPercentage=60
      TZ: Europe/Berlin
    volumes:
      - simdata:/app/data
    networks:
      default:
        aliases:
          - postfach-simulator
    mem_limit: 384m

  auth:
    <<: *dotnet
    image: bpsim-auth:${BPSIM_TAG:-latest}
    environment:
      <<: *dotnet-env
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=AuthServer;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
      Database__MigrateOnStartup: "true"
      OpenIddict__Issuer: https://auth.${BPSIM_DOMAIN}/
      OpenIddict__SigningCertificatePath: /certs/signing.pfx
      OpenIddict__EncryptionCertificatePath: /certs/encryption.pfx
      OpenIddict__CertificatePassword: ${OIDC_CERT_PASSWORD:?OIDC_CERT_PASSWORD fehlt}
      OpenIddict__Clients__mvc_web__ClientSecret: ${WEB_CLIENT_SECRET:?WEB_CLIENT_SECRET fehlt}
      OpenIddict__Clients__mvc_web__RedirectUris__0: https://${BPSIM_DOMAIN}/signin-oidc
      OpenIddict__Clients__mvc_web__PostLogoutRedirectUris__0: https://${BPSIM_DOMAIN}/signout-callback-oidc
      BundId__SpEntityId: https://auth.${BPSIM_DOMAIN}/bundid/metadata
      BundId__AssertionConsumerServiceUrl: https://auth.${BPSIM_DOMAIN}/bundid/acs
      # Metadaten intern abrufen; darin stehen die öffentlichen Adressen des Simulators (für den Browser).
      BundId__IdpMetadataUrl: http://bundid-simulator:8080/saml/metadata
      # SAML-Inspektor (auth.<domain>/bundid/inspektor): standardmäßig an, BPSIM_INSPEKTOR=false schaltet ab (404)
      BundId__Inspektor__Enabled: ${BPSIM_INSPEKTOR:-true}
      BundId__Inspektor__PortalUrl: https://${BPSIM_DOMAIN}
      # Data-Protection-Schlüssel (Tabelle DataProtectionKeys) verschlüsselt ablegen (X4)
      DataProtection__CertificatePath: /dpcert/dataprotection.pfx
      DataProtection__CertificatePassword: ${DATAPROTECTION_CERT_PASSWORD:?DATAPROTECTION_CERT_PASSWORD fehlt}
    volumes:
      - ./secrets/oidc:/certs:ro
      - ./secrets/dataprotection:/dpcert:ro
    depends_on:
      sqlserver:
        condition: service_healthy
      bundid-simulator:
        condition: service_started
    mem_limit: 384m

  api:
    <<: *dotnet
    image: bpsim-api:${BPSIM_TAG:-latest}
    environment:
      <<: *dotnet-env
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=BuergerPortalDB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
      Database__MigrateOnStartup: "true"
      Authentication__Authority: https://auth.${BPSIM_DOMAIN}
      Authentication__Audience: buergerportal_api
      # Einlieferung an das Postfach der gewählten Variante: postfach-simulator (BundID-Simulator) oder postfach-dienst
      Postkorb__BaseUrl: http://postfach-${BPSIM_POSTFACH:-simulator}:8080/
      Postkorb__ApiKey: ${POSTKORB_API_KEY:?POSTKORB_API_KEY fehlt}
      # Keine echten E-Mails aus der Simulation (Testpersonen haben fiktive Adressen).
      MailJet__ApiKey: disabled
      MailJet__SecretKey: disabled
      # Benachrichtigungen aufs Handy (Web Push): VAPID-Schlüssel aus der .env (deploy.ps1 erzeugt sie einmalig),
      # Kontakt für die Push-Dienste = Adresse des Portals. Ohne Schlüssel bleibt Push aus.
      Push__VapidPublicKey: ${BPSIM_VAPID_PUBLIC_KEY:-}
      Push__VapidPrivateKey: ${BPSIM_VAPID_PRIVATE_KEY:-}
      Push__Subject: https://${BPSIM_DOMAIN}
    mem_limit: 320m

  web:
    <<: *dotnet
    image: bpsim-web:${BPSIM_TAG:-latest}
    environment:
      <<: *dotnet-env
      Authentication__Authority: https://auth.${BPSIM_DOMAIN}
      Authentication__ClientId: mvc_web
      Authentication__ClientSecret: ${WEB_CLIENT_SECRET}
      Api__BaseUrl: http://api:8080/
      # Link „Mein BundID-Postfach“ – gleiche Adresse in beiden Varianten; Variante für den Hinweis-Dialog
      Postkorb__PostfachUrl: "https://bundid.${BPSIM_DOMAIN}/postfach/"
      Postkorb__Variante: ${BPSIM_POSTFACH:-simulator}
      DataProtection__KeysPath: /data/keys
      DataProtection__CertificatePath: /dpcert/dataprotection.pfx
      DataProtection__CertificatePassword: ${DATAPROTECTION_CERT_PASSWORD:?DATAPROTECTION_CERT_PASSWORD fehlt}
      # Content-Security-Policy des Portals: gleicher Schalter wie für die übrigen Hosts (Caddy)
      Csp__Header: ${BPSIM_CSP_HEADER:-Content-Security-Policy}
      # Link „SAML-Inspektor“ in „Meine Daten“ – gleicher Schalter wie im Auth-Server
      BundId__Inspektor__Enabled: ${BPSIM_INSPEKTOR:-true}
    volumes:
      - webkeys:/data/keys
      - ./secrets/dataprotection:/dpcert:ro
    depends_on:
      auth:
        condition: service_started
      api:
        condition: service_started
    mem_limit: 320m

  postkorb:
    <<: *dotnet
    image: bpsim-postkorb:${BPSIM_TAG:-latest}
    environment:
      <<: *dotnet-env
      ConnectionStrings__DefaultConnection: Server=sqlserver;Database=PostkorbDB;User Id=sa;Password=${SQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=true
      Database__MigrateOnStartup: "true"
      PostkorbApi__ApiKey: ${POSTKORB_API_KEY}
      # Das Postfach ist Teil des BundID-Auftritts: https://bundid.<domain>/postfach (Caddy leitet den Pfad weiter)
      PathBase: /postfach
      BundId__SpEntityId: https://bundid.${BPSIM_DOMAIN}/postfach/bundid/metadata
      BundId__AssertionConsumerServiceUrl: https://bundid.${BPSIM_DOMAIN}/postfach/bundid/acs
      BundId__IdpMetadataUrl: http://bundid-simulator:8080/saml/metadata
      DataProtection__KeysPath: /data/keys
      DataProtection__CertificatePath: /dpcert/dataprotection.pfx
      DataProtection__CertificatePassword: ${DATAPROTECTION_CERT_PASSWORD:?DATAPROTECTION_CERT_PASSWORD fehlt}
      Postfach__RuecksprungUrl: https://${BPSIM_DOMAIN}/
      Postfach__RuecksprungName: BürgerPortal
    volumes:
      - postkorbkeys:/data/keys
      - ./secrets/dataprotection:/dpcert:ro
    networks:
      default:
        aliases:
          - postfach-dienst
    mem_limit: 256m

volumes:
  caddy_data:
  caddy_config:
  sqldata:
  simdata:
  webkeys:
  postkorbkeys:
