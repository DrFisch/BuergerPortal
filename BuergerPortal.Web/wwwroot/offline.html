<!doctype html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <title>Offline – BürgerPortal</title>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="theme-color" content="#0d6efd">
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            background: #f8f9fa;
            color: #212529;
        }

        main {
            max-width: 28rem;
            padding: 2rem;
            text-align: center;
        }

        .muted {
            color: #6c757d
        }

        .retry {
            display: inline-block;
            margin-top: 1rem;
            padding: .6rem 1.4rem;
            border: 0;
            border-radius: 2rem;
            background: #0d6efd;
            color: #fff;
            font-size: 1rem;
            text-decoration: none;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background: #212529;
                color: #dee2e6
            }

            .muted {
                color: #adb5bd
            }
        }
    </style>
</head>
<body>
    <main>
        <h1>Sie sind offline</h1>
        <p class="muted">
            Das BürgerPortal braucht eine Internetverbindung. Aus Datenschutzgründen speichert die App keine Seiten mit
            Ihren persönlichen Daten auf dem Gerät.
        </p>
        <!-- Link auf die aktuelle Adresse statt onclick="location.reload()": ohne Skript (Content-Security-Policy) -->
        <a class="retry" href="">Erneut versuchen</a>
    </main>
</body>
</html>
